name: ci  # continuous integration
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # All available versions of Python:
        # https://github.com/actions/python-versions/blob/main/versions-manifest.json
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.15t"]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Poetry
        # NOTE: poetry>=2.3.0 is needed to install Python 3.15t correctly
        run: pipx install "poetry>=2.4.0,<2.5.0"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Display Python version
        run: poetry run python -c "import sys; print(sys.version)"

      - name: Display pip version
        run: poetry run python -m pip --version

      - name: Display Poetry version
        run: poetry --version

      - name: Install dependencies with Poetry
        run: poetry install

      - name: "Free-threaded Python: Verify GIL is disabled"
        if: endsWith(matrix.python-version, 't')
        run: poetry run python -c "import sys, trycast; assert not sys._is_gil_enabled(), 'GIL unexpectedly enabled'"

      - name: Lint
        run: poetry run make lint

      - name: Run tests
        run: poetry run python -m unittest
